name: Evaluation

on:
  push:

jobs:
  eval:
    runs-on: ubuntu-latest
    # Deliberately no env/secrets: this repo doesn't put provider keys in GitHub
    # Actions. With no GROQ_API_KEY/MISTRAL_API_KEY set, run_eval.py skips every
    # case that needs a live LLM call (marked SKIPPED, not FAIL) and runs only the
    # rule-based checks that don't need one — see src/eval/scorer.py.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run evaluation harness
        run: python run.py eval

      - name: Fail on hard-gate failures
        if: always()
        run: |
          python -c "import json, pathlib, sys; report = pathlib.Path('eval_report.json'); data = json.loads(report.read_text(encoding='utf-8')); failed = [r['case_id'] for r in data['results'] if r['hard_gate_pass'] is False]; skipped = [r['case_id'] for r in data['results'] if r['hard_gate_pass'] is None]; print('Hard-gate failures:', ', '.join(failed) if failed else 'none'); print('Skipped (no provider key):', ', '.join(skipped) if skipped else 'none'); sys.exit(bool(failed))"

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.md
          if-no-files-found: warn
