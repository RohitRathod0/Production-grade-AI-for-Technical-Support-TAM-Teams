name: Evaluation

on:
  push:

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      LLM_PROVIDER: groq
      JUDGE_PROVIDER: mistral
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run evaluation harness
        run: python run.py eval

      - name: Fail on hard-gate failures
        if: always()
        run: |
          python -c "import json, pathlib, sys; report = pathlib.Path('eval_report.json'); data = json.loads(report.read_text(encoding='utf-8')); failed = [r['case_id'] for r in data['results'] if not r['hard_gate_pass']]; print('Hard-gate failures:', ', '.join(failed) if failed else 'none'); sys.exit(bool(failed))"

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.md
          if-no-files-found: warn
